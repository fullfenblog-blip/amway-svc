@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg: #f6f3ec;
  --bg-grid: rgba(28, 24, 21, 0.04);
  --surface-1: #ffffff;
  --surface-2: #fbf8f1;
  --surface-3: #f0ebe0;
  --border: #e5dfd0;
  --border-hi: #c8c0ad;
  --accent: #ea580c;
  --accent-soft: #f97316;
  --accent-deep: #9a3412;
  --cyan: #0e7490;
  --green: #15803d;
  --red: #b91c1c;
  --text-1: #1c1815;
  --text-2: #5c544a;
  --text-3: #918876;
  --text-4: #c4bdaa;
  --shadow-sm: 0 1px 2px rgba(28, 24, 21, 0.04), 0 1px 3px rgba(28, 24, 21, 0.05);
  --shadow-md: 0 4px 12px -2px rgba(28, 24, 21, 0.08), 0 2px 5px rgba(28, 24, 21, 0.05);
  --shadow-lg: 0 12px 32px -8px rgba(28, 24, 21, 0.16), 0 4px 8px rgba(28, 24, 21, 0.04);
  --display: 'Bricolage Grotesque', 'Noto Sans TC', sans-serif;
  --body: 'Noto Sans TC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
*::selection { background: var(--accent); color: #fff; }

html, body, #root {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--body);
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Subtle grid background */
.bg-grid {
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
}

/* Add soft drop shadow to cards for depth on light bg */
.card { box-shadow: var(--shadow-sm); }
.card-flat { background: var(--surface-2); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

/* Buttons */
button { font-family: inherit; cursor: pointer; transition: all .15s ease; }
button:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); color: #fff;
  border: 1px solid var(--accent);
  padding: 11px 22px; border-radius: 8px;
  font-weight: 700; font-size: 13px; letter-spacing: .3px;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(234, 88, 12, 0.45); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-secondary {
  background: var(--surface-1); color: var(--text-1);
  border: 1px solid var(--border);
  padding: 11px 22px; border-radius: 8px;
  font-weight: 600; font-size: 13px;
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-hi); box-shadow: var(--shadow-md); }
.btn-ghost {
  background: transparent; color: var(--text-2);
  border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 6px;
  font-weight: 500; font-size: 12px;
}
.btn-ghost:hover:not(:disabled) { color: var(--text-1); border-color: var(--border-hi); background: var(--surface-2); }
.btn-danger {
  background: rgba(185, 28, 28, .08); color: var(--red);
  border: 1px solid rgba(185, 28, 28, .25);
  padding: 8px 14px; border-radius: 6px;
  font-weight: 600; font-size: 12px;
}
.btn-danger:hover:not(:disabled) { background: rgba(185, 28, 28, .15); }

/* Inputs */
input, textarea, select {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  color: var(--text-1);
  font-size: 13px;
  font-family: inherit;
  width: 100%; outline: none;
  transition: all .15s ease;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12); }
input::placeholder, textarea::placeholder { color: var(--text-3); }
select option { background: var(--surface-1); }

/* Cards */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
}
.card-flat {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
}

/* Type */
.display { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; }
.mono { font-family: var(--mono); }
.label-xs {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--text-3); text-transform: uppercase;
  font-family: var(--mono);
}
.section-marker {
  display: inline-flex; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  color: var(--text-3); text-transform: uppercase;
}
.section-marker::before {
  content: ''; width: 6px; height: 6px;
  background: var(--accent); border-radius: 50%;
  display: inline-block; align-self: center;
}

/* Animations */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes blink { 50% { opacity: 0; } }

.anim-fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) backwards; }
.stagger > * { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) backwards; }
.stagger > *:nth-child(1) { animation-delay: .04s; }
.stagger > *:nth-child(2) { animation-delay: .1s; }
.stagger > *:nth-child(3) { animation-delay: .16s; }
.stagger > *:nth-child(4) { animation-delay: .22s; }
.stagger > *:nth-child(5) { animation-delay: .28s; }
.stagger > *:nth-child(6) { animation-delay: .34s; }
.stagger > *:nth-child(7) { animation-delay: .4s; }
.stagger > *:nth-child(8) { animation-delay: .46s; }

.live-dot {
  display: inline-block; width: 7px; height: 7px;
  background: var(--green); border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}

/* Choice button (quiz) */
.choice-btn {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  cursor: pointer; color: var(--text-1);
  font-size: 14px; text-align: left;
  display: flex; gap: 14px; align-items: flex-start;
  transition: all .15s ease;
  width: 100%; font-family: inherit;
  box-shadow: var(--shadow-sm);
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-2);
  transform: translateX(2px);
  box-shadow: var(--shadow-md);
}
.choice-btn .letter {
  font-family: var(--mono); font-weight: 700; font-size: 13px;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--accent);
  flex-shrink: 0;
}
.choice-btn:hover:not(:disabled) .letter {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

/* Hero number */
.hero-num {
  font-family: var(--display);
  font-weight: 800;
  font-size: 88px;
  line-height: .9;
  letter-spacing: -.04em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* Pills */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  border: 1px solid;
}
.pill-mono { font-family: var(--mono); letter-spacing: .5px; }

/* Tab pill */
.tab-pill {
  padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--text-3);
  font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s ease;
}
.tab-pill:hover { color: var(--text-2); }
.tab-pill.active { background: var(--surface-2); color: var(--accent); border-color: var(--border); }

@media (max-width: 600px) {
  .hero-num { font-size: 64px; }
}
