<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AMWAY SVC — 驗收模組安裝程式</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f3ec;padding:32px 20px;max-width:700px;margin:0 auto;}
h1{font-size:24px;font-weight:800;margin-bottom:8px;color:#1c1815;}
p{color:#5c544a;font-size:14px;line-height:1.7;margin-bottom:16px;}
.step{background:#fff;border:1px solid #e5dfd0;border-radius:12px;padding:20px;margin-bottom:12px;}
.step h3{font-size:13px;font-weight:700;color:#ea580c;margin-bottom:8px;font-family:monospace;letter-spacing:1px;}
.step p{margin:0;font-size:13px;}
pre{background:#1c1815;color:#86efac;padding:14px;border-radius:8px;font-size:11px;overflow-x:auto;line-height:1.6;}
button{background:#ea580c;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
button:hover{background:#9a3412;}
.ok{background:rgba(21,128,61,.1);border:1px solid rgba(21,128,61,.3);padding:14px;border-radius:8px;color:#15803d;font-size:14px;font-weight:600;display:none;}
.err{background:rgba(185,28,28,.1);border:1px solid rgba(185,28,28,.3);padding:14px;border-radius:8px;color:#b91c1c;font-size:14px;display:none;}
input[type=file]{display:none;}
</style>
</head>
<body>
<h1>✅ 驗收模組安裝程式</h1>
<p>此工具將「到府驗收」功能注入到現有的 AMWAY SVC index.html，完整保留原有所有功能。</p>

<div class="step">
<h3>STEP 1 — 選擇現有 index.html</h3>
<p>請選擇您從 GitHub repo 下載的原始 index.html 檔案：</p>
<button onclick="document.getElementById('fi').click()">📂 選擇 index.html</button>
<input type="file" id="fi" accept=".html" onchange="loadFile(this)">
</div>

<div class="step" id="step2" style="display:none">
<h3>STEP 2 — 注入驗收模組</h3>
<p id="fileInfo"></p>
<button onclick="doPatch()">⚡ 注入驗收模組並下載</button>
</div>

<div class="ok" id="okMsg">✓ 完成！已下載 patched index.html，上傳至 GitHub 即可部署。</div>
<div class="err" id="errMsg"></div>

<script>
let originalHTML = "";

function loadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    originalHTML = e.target.result;
    document.getElementById("fileInfo").textContent = `已載入：${file.name}（${(originalHTML.length/1024).toFixed(0)} KB）`;
    document.getElementById("step2").style.display = "block";
  };
  reader.readAsText(file, "utf-8");
}


const ACCEPTANCE_MODULE = '// ═══════════════════════════════════════════════════════════════\n// ACCEPTANCE MODULE - 到府驗收 (Admin Only)\n// Injected into existing AMWAY SVC app\n// ═══════════════════════════════════════════════════════════════\n\nconst DEFAULT_ACCEPTANCE_CL = {\n  install: {\n    etiquette: [\n      {id:"ei1",text:"準時或提前5分鐘到達（來不及需提前30分鐘通知）",critical:false},\n      {id:"ei2",text:"服裝儀容整潔、無明顯汙損或異味",critical:false},\n      {id:"ei3",text:"須著安麗背心到府按電鈴",critical:true},\n      {id:"ei4",text:"依規定出示識別證給客戶看",critical:true},\n      {id:"ei5",text:"以客戶姓氏稱呼（如：李先生/李太太）",critical:false},\n      {id:"ei6",text:"自我介紹並表明來意",critical:false},\n      {id:"ei7",text:"若需脫鞋，確實脫鞋後再入內",critical:false},\n    ],\n    prep: [\n      {id:"pi1",text:"施工前檢視環境、確認安裝條件並主動告知安裝方式",critical:false},\n      {id:"pi2",text:"確認機號與派工資料一致（登入保固查詢系統核對）",critical:true},\n      {id:"pi3",text:"提供個資聲明給客戶詳閱並取得口頭同意（施工前）",critical:true},\n      {id:"pi4",text:"需移動物品時須先請示客戶同意",critical:false},\n      {id:"pi5",text:"安裝工具與零配件確認齊全且功能正常",critical:false},\n      {id:"pi6",text:"主動於工具箱下方鋪布，確保顧客環境整潔",critical:false},\n    ],\n    work: [\n      {id:"wi1",text:"安裝前拍照（整體、檯面上、檯面下、水源、電源共5張）",critical:true},\n      {id:"wi2",text:"拆箱、撕除包裝袋及機身膠帶，確認配件完整",critical:false},\n      {id:"wi3",text:"打開側蓋比對機號與外箱及派工編號相符",critical:true},\n      {id:"wi4",text:"指導客戶濾心匣拆裝、說明管塞",critical:false},\n      {id:"wi5",text:"口頭告知鑽孔無法復原並取得客戶同意",critical:true},\n      {id:"wi6",text:"確認鑽孔位置，鋪濕布保護，鑽孔後刷清鐵屑",critical:false},\n      {id:"wi7",text:"確認鵝頸安裝方向（開關面向位置）",critical:false},\n      {id:"wi8",text:"安裝三通接頭、三色管及電源線",critical:false},\n      {id:"wi9",text:"未插電試水做碳粉排除（放流至少5分鐘）",critical:true},\n      {id:"wi10",text:"以衛生紙實際測試五大漏水點至少5分鐘",critical:true},\n      {id:"wi11",text:"淨水器外殼使用LOC清潔擦拭",critical:false},\n      {id:"wi12",text:"下載APP、創建Amway ID、完成連線設定",critical:false},\n      {id:"wi13",text:"主動說明面板燈號意義及更換時機",critical:false},\n      {id:"wi14",text:"安裝後拍照存檔（整體、整機、鵝頸、來源水、電源）",critical:true},\n    ],\n    closing: [\n      {id:"ci
