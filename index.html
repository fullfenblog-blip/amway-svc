const ACC_SEC_LABELS = {etiquette:"服務禮儀",prep:"施工前準備",work:"施工作業",closing:"離前作業"};

// ── AcceptanceForm (新增驗收) ─────────────────────────────────
function AcceptanceForm({session, accounts, acCl, onSaved}) {
  const [svcType, setSvcType] = React.useState("install");
  const [svcDate, setSvcDate] = React.useState(new Date().toISOString().split("T")[0]);
  const [techUser, setTechUser] = React.useState("");
  const [vendor, setVendor] = React.useState("xinyu");
  const [orderNo, setOrderNo] = React.useState("");
  const [machineNo, setMachineNo] = React.useState("");
  const [warranty, setWarranty] = React.useState("in");
  const [custName, setCustName] = React.useState("");
  const [svcFee, setSvcFee] = React.useState("");
  const [partsFee, setPartsFee] = React.useState("");
  const [custSign, setCustSign] = React.useState("yes");
  const [remarks, setRemarks] = React.useState("");
  const [checks, setChecks] = React.useState({});
  const [remarkMap, setRemarkMap] = React.useState({});
  const [verdict, setVerdict] = React.useState("");
  const [verdictNote, setVerdictNote] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [saved, setSaved] = React.useState(false);
  const [err, setErr] = React.useState("");

  const techList = Object.entries(accounts).filter(([,v])=>v.role==="tech"||v.role===undefined);
  const cl = (acCl||DEFAULT_ACCEPTANCE_CL)[svcType] || DEFAULT_ACCEPTANCE_CL[svcType];

  const allItems = Object.values(cl).flat();
  const answered = allItems.filter(i=>checks[i.id] && checks[i.id]!=="na");
  const passedN = answered.filter(i=>checks[i.id]==="pass").length;
  const failedN = answered.filter(i=>checks[i.id]==="fail").length;
  const score = answered.length > 0 ? Math.round(passedN/answered.length*100) : null;
  const pct = score ?? 0;
  const fillColor = pct>=90?"var(--green)":pct>=70?"var(--accent)":"var(--red)";

  const setCheck = (id,val) => setChecks(p=>({...p,[id]:val}));
  const setRemark = (id,val) => setRemarkMap(p=>({...p,[id]:val}));

  const reset = () => {
    setOrderNo(""); setMachineNo(""); setCustName(""); setSvcFee(""); setPartsFee("");
    setRemarks(""); setChecks({}); setRemarkMap({}); setVerdict(""); setVerdictNote("");
    setSaved(false); setErr("");
  };

  const handleSave = async () => {
    if (!orderNo.trim()) { setErr("請填寫派工單號"); return; }
    if (!techUser) { setErr("請選擇驗收技師"); return; }
    if (!verdict) { setErr("請選擇驗收結論（通過 / 需複驗）"); return; }
    setSaving(true); setErr("");
    const techAcc = accounts[techUser]||{};
    const data = {
      submittedAt: new Date().toISOString(),
      submittedBy: session.username,
      svcType, svcDate,
      techUsername: techUser, techName: techAcc.displayName||techUser,
      techGroup: techAcc.group||"",
      vendor, orderNo: orderNo.trim(), machineNo: machineNo.trim(),
      warranty, custName: custName.trim(), svcFee, partsFee, custSign, remarks,
      checks, remarksDetail: remarkMap,
      score,
      verdict, verdictNote,
      verdictAt: new Date().toISOString(),
      verdictBy: session.username,
    };
    const key = svcDate+"_"+orderNo.trim().replace(/\s/g,"_")+"_"+Date.now().toString(36);
    try {
      await fbSet("acceptance_forms/"+key, data);
      setSaving(false); setSaved(true);
      onSaved && onSaved();
    } catch(e) {
      setErr("儲存失敗："+e.message); setSaving(false);
    }
  };

  if (saved) return React.createElement("div",{style:{maxWidth:600}},
    React.createElement("div",{style:{background:"rgba(21,128,61,.1)",border:"1px solid rgba(21,128,61,.4)",borderRadius:12,padding:"20px 24px",marginBottom:20,display:"flex",gap:14,alignItems:"center"}},
      React.createElement("div",{style:{fontSize:28}},"✓"),
      React.createElement("div",null,
        React.createElement("div",{style:{fontWeight:700,fontSize:16,color:"var(--green)"}},`驗收記錄已儲存`),
        React.createElement("div",{style:{fontSize:12,color:"var(--text-2)",marginTop:4}},`技師：${accounts[techUser]?.displayName||techUser} ｜ 工單：${orderNo} ｜ 分數：${score!=null?score+"%":"–"}`)
      )
    ),
    React.createElement("button",{className:"btn-primary",onClick:reset},"+ 新增下一筆驗收")
  );

  const renderSection = (secKey) => {
    const items = cl[secKey]||[];
    if (!items.length) return null;
    return React.createElement("div",{key:secKey,style:{marginBottom:20}},
      React.createElement("div",{style:{fontSize:10,fontWeight:700,letterSpacing:"1.5px",color:"var(--text-3)",textTransform:"uppercase",fontFamily:"var(--mono)",padding:"6px 0 8px",borderBottom:"1px solid var(--border)",marginBottom:8}},
        ACC_SEC_LABELS[secKey]||secKey),
      items.map((item,idx)=>React.createElement("div",{key:item.id},
        React.createElement("div",{style:{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 4px",borderRadius:4}},
          React.createElement("div",{style:{display:"flex",gap:4,flexShrink:0,marginTop:1}},
            ["pass","fail","na"].map(v=>{
              const isOn = checks[item.id]===v;
              const bg = isOn?(v==="pass"?"rgba(21,128,61,.15)":v==="fail"?"rgba(185,28,28,.12)":"var(--surface-3)"):"transparent";
              const border = isOn?(v==="pass"?"rgba(21,128,61,.5)":v==="fail"?"rgba(185,28,28,.4)":"var(--border-hi)"):"var(--border)";
              const color = isOn?(v==="pass"?"var(--green)":v==="fail"?"var(--red)":"var(--text-2)"):"var(--text-3)";
              return React.createElement("button",{key:v,
                onClick:()=>setCheck(item.id,v),
                style:{width:40,height:40,border:`1px solid ${border}`,borderRadius:8,background:bg,cursor:"pointer",fontSize:11,fontWeight:700,color,transition:"all .12s",fontFamily:"var(--mono)"}},
                v==="pass"?"✓":v==="fail"?"✗":"N/A"
              );
            })
          ),
          React.createElement("div",{style:{flex:1}},
            React.createElement("div",{style:{fontSize:15,lineHeight:1.6,color:"var(--text-1)",display:"flex",gap:8,alignItems:"flex-start",flexWrap:"wrap"}},
              React.createElement("span",{style:{fontSize:10,color:"var(--text-4)",fontFamily:"var(--mono)",flexShrink:0,paddingTop:2}},String(idx+1).padStart(2,"0")),
              item.text,
              item.critical && React.createElement("span",{style:{fontSize:10,padding:"1px 6px",borderRadius:10,background:"rgba(185,28,28,.1)",color:"var(--red)",border:"1px solid rgba(185,28,28,.2)",fontWeight:700,whiteSpace:"nowrap",flexShrink:0}},"必查")
            )
          )
        ),
        checks[item.id]==="fail" && React.createElement("input",{
          style:{width:"100%",marginTop:3,padding:"5px 10px",fontSize:12,border:"1px solid rgba(185,28,28,.3)",borderRadius:6,background:"rgba(185,28,28,.04)"},
          placeholder:"缺失說明...",
          value:remarkMap[item.id]||"",
          onChange:e=>setRemark(item.id,e.target.value)
        })
      ))
    );
  };

  return React.createElement("div",{style:{maxWidth:720}},
    // Score bar
    React.createElement("div",{style:{display:"flex",gap:20,alignItems:"center",background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 20px",marginBottom:20}},
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:40,fontWeight:800,fontFamily:"var(--display)",letterSpacing:"-.04em",color:score!=null?fillColor:"var(--text-4)",lineHeight:1}},score!=null?pct+"%":"—"),
        React.createElement("div",{style:{fontSize:11,color:"var(--text-3)",fontFamily:"var(--mono)",letterSpacing:1}},score!=null?"完成度":"尚未填寫")
      ),
      React.createElement("div",{style:{flex:1}},
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--text-2)",marginBottom:6}},
          React.createElement("span",{style:{color:"var(--green)"}},`合格 ${passedN}`),
          React.createElement("span",{style:{color:"var(--red)"}},`缺失 ${failedN}`)
        ),
        React.createElement("div",{style:{height:5,background:"var(--surface-3)",borderRadius:3,overflow:"hidden"}},
          React.createElement("div",{style:{height:5,width:pct+"%",background:fillColor,transition:"width .3s",borderRadius:3}})
        )
      )
    ),
    // Basic info card
    React.createElement("div",{className:"card",style:{marginBottom:16}},
      React.createElement(SectionMarker,{no:1,label:"派工基本資訊"}),
      React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}},

// ── AcceptanceConfig (驗收項目設定) ──────────────────────────
function AcceptanceConfig({acCl, onSaved}) {
  const [cl, setCl] = React.useState(null);
  const [activeType, setActiveType] = React.useState("install");
  const [activeSec, setActiveSec] = React.useState("etiquette");
  const [saving, setSaving] = React.useState(false);
  const [msg, setMsg] = React.useState("");

  React.useEffect(()=>{
    setCl(JSON.parse(JSON.stringify(acCl||DEFAULT_ACCEPTANCE_CL)));
  },[acCl]);

  if (!cl) return React.createElement("div",{style:{color:"var(--text-3)"}},React.createElement("div",{style:{width:32,height:32,border:"2px solid var(--border)",borderTopColor:"var(--accent)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto"}}));

  const items = cl[activeType]?.[activeSec]||[];

  const addItem = ()=>{
    const id="custom_"+Date.now();
    setCl(prev=>{const n=JSON.parse(JSON.stringify(prev));if(!n[activeType])n[activeType]={};if(!n[activeType][activeSec])n[activeType][activeSec]=[];n[activeType][activeSec].push({id,text:"新增項目",critical:false});return n;});
  };
  const updateItem = (idx,key,val)=>{
    setCl(prev=>{const n=JSON.parse(JSON.stringify(prev));n[activeType][activeSec][idx][key]=val;return n;});
  };
  const removeItem = (idx)=>{
    if(!confirm("確定刪除此項目？"))return;
    setCl(prev=>{const n=JSON.parse(JSON.stringify(prev));n[activeType][activeSec].splice(idx,1);return n;});
  };
  const moveItem = (idx,dir)=>{
    setCl(prev=>{
      const n=JSON.parse(JSON.stringify(prev));
      const arr=n[activeType][activeSec];
      const to=idx+dir;
      if(to<0||to>=arr.length)return prev;
      [arr[idx],arr[to]]=[arr[to],arr[idx]];
      return n;
    });
  };
  const handleSave = async ()=>{
    setSaving(true);setMsg("");
    try{await onSaved(cl);setMsg("✓ 已儲存");}catch{setMsg("✗ 儲存失敗");}
    setSaving(false);
  };

  return React.createElement("div",{style:{maxWidth:720}},
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:20,flexWrap:"wrap"}},
      React.createElement("div",{className:"display",style:{fontSize:24,fontWeight:800,flex:1}},"驗收項目設定"),
      msg&&React.createElement("span",{style:{fontSize:13,color:msg.startsWith("✓")?"var(--green)":"var(--red)"}},msg),
      React.createElement("button",{className:"btn-primary",onClick:handleSave,disabled:saving},
        saving?"儲存中…":"💾 儲存所有設定"
      )
    ),
    React.createElement("div",{className:"card",style:{marginBottom:14}},
      React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}},
        Object.entries(ACC_SVC_LABELS).map(([k,v])=>React.createElement("button",{key:k,className:`tab-pill ${activeType===k?"active":""}`,onClick:()=>setActiveType(k)},v))
      ),
      React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        Object.entries(ACC_SEC_LABELS).map(([k,v])=>React.createElement("button",{key:k,className:`tab-pill ${activeSec===k?"active":""}`,onClick:()=>setActiveSec(k),style:{fontSize:11}},v))
      )
    ),
    React.createElement("div",{className:"card"},
      React.createElement(SectionMarker,{no:1,label:ACC_SVC_LABELS[activeType]+" — "+ACC_SEC_LABELS[activeSec],right:`${items.length} 項`}),
      items.map((item,idx)=>React.createElement("div",{key:item.id,style:{display:"flex",gap:8,alignItems:"center",padding:"7px 0",borderBottom:"1px solid var(--border)"}},
        React.createElement("span",{className:"mono",style:{fontSize:11,color:"var(--text-4)",width:24,textAlign:"center",flexShrink:0}},idx+1),
        React.createElement("input",{
          value:item.text,onChange:e=>updateItem(idx,"text",e.target.value),
          style:{flex:1,padding:"7px 10px",border:"1px solid var(--border)",borderRadius:7,fontSize:13,fontFamily:"inherit",background:"var(--surface-1)",color:"var(--text-1)"}
        }),
        React.createElement("label",{style:{display:"flex",alignItems:"center",gap:4,fontSize:12,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},
          React.createElement("input",{type:"checkbox",checked:item.critical,onChange:e=>updateItem(idx,"critical",e.target.checked)}),
          "必查"
        ),
        React.createElement("button",{className:"btn-ghost",style:{padding:"4px 8px",fontSize:12},onClick:()=>moveItem(idx,-1),disabled:idx===0},"↑"),
        React.createElement("button",{className:"btn-ghost",style:{padding:"4px 8px",fontSize:12},onClick:()=>moveItem(idx,1),disabled:idx===items.length-1},"↓"),
        React.createElement("button",{className:"btn-danger",style:{padding:"4px 10px",fontSize:12},onClick:()=>removeItem(idx)},"✕")

:root {
  --bg: #f6f3ec;
  --bg-grid: rgba(28, 24, 21, 0.04);
  --surface-1: #ffffff;
  --surface-2: #fbf8f1;
  --surface-3: #f0ebe0;
  --border: #e5dfd0;
  --border-hi: #c8c0ad;
  --accent: #ea580c;
  --accent-soft: #f97316;
  --accent-deep: #9a3412;
  --cyan: #0e7490;
  --green: #15803d;
  --red: #b91c1c;
  --text-1: #1c1815;
  --text-2: #5c544a;
  --text-3: #918876;
  --text-4: #c4bdaa;
  --shadow-sm: 0 1px 2px rgba(28, 24, 21, 0.04), 0 1px 3px rgba(28, 24, 21, 0.05);
  --shadow-md: 0 4px 12px -2px rgba(28, 24, 21, 0.08), 0 2px 5px rgba(28, 24, 21, 0.05);
  --shadow-lg: 0 12px 32px -8px rgba(28, 24, 21, 0.16), 0 4px 8px rgba(28, 24, 21, 0.04);
  --display: 'Bricolage Grotesque', 'Noto Sans TC', sans-serif;
  --body: 'Noto Sans TC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
*::selection { background: var(--accent); color: #fff; }

html, body, #root {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--body);
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Subtle grid background */
.bg-grid {
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
}

/* Add soft drop shadow to cards for depth on light bg */
.card { box-shadow: var(--shadow-sm); }
.card-flat { background: var(--surface-2); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

/* Buttons */
button { font-family: inherit; cursor: pointer; transition: all .15s ease; }
button:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); color: #fff;
  border: 1px solid var(--accent);
  padding: 11px 22px; border-radius: 8px;
  font-weight: 700; font-size: 13px; letter-spacing: .3px;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(234, 88, 12, 0.45); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-secondary {
  background: var(--surface-1); color: var(--text-1);
  border: 1px solid var(--border);
  padding: 11px 22px; border-radius: 8px;
  font-weight: 600; font-size: 13px;
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-hi); box-shadow: var(--shadow-md); }
.btn-ghost {
  background: transparent; color: var(--text-2);
  border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 6px;
  font-weight: 500; font-size: 12px;
}
.btn-ghost:hover:not(:disabled) { color: var(--text-1); border-color: var(--border-hi); background: var(--surface-2); }
.btn-danger {
  background: rgba(185, 28, 28, .08); color: var(--red);
  border: 1px solid rgba(185, 28, 28, .25);
  padding: 8px 14px; border-radius: 6px;
  font-weight: 600; font-size: 12px;
}
.btn-danger:hover:not(:disabled) { background: rgba(185, 28, 28, .15); }

/* Inputs */
input, textarea, select {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  color: var(--text-1);
  font-size: 13px;
  font-family: inherit;
  width: 100%; outline: none;
  transition: all .15s ease;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12); }
input::placeholder, textarea::placeholder { color: var(--text-3); }
select option { background: var(--surface-1); }

/* Cards */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
}
.card-flat {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
}

/* Type */
.display { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; }
.mono { font-family: var(--mono); }
.label-xs {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--text-3); text-transform: uppercase;
  font-family: var(--mono);
}
.section-marker {
  display: inline-flex; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  color: var(--text-3); text-transform: uppercase;
}
.section-marker::before {
  content: ''; width: 6px; height: 6px;
  background: var(--accent); border-radius: 50%;
  display: inline-block; align-self: center;
}

/* Animations */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes blink { 50% { opacity: 0; } }

.anim-fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) backwards; }
.stagger > * { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) backwards; }
.stagger > *:nth-child(1) { animation-delay: .04s; }
.stagger > *:nth-child(2) { animation-delay: .1s; }
.stagger > *:nth-child(3) { animation-delay: .16s; }
.stagger > *:nth-child(4) { animation-delay: .22s; }
.stagger > *:nth-child(5) { animation-delay: .28s; }
.stagger > *:nth-child(6) { animation-delay: .34s; }
.stagger > *:nth-child(7) { animation-delay: .4s; }
.stagger > *:nth-child(8) { animation-delay: .46s; }

.live-dot {
  display: inline-block; width: 7px; height: 7px;
  background: var(--green); border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}

/* Choice button (quiz) */
.choice-btn {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  cursor: pointer; color: var(--text-1);
  font-size: 14px; text-align: left;
  display: flex; gap: 14px; align-items: flex-start;
  transition: all .15s ease;
  width: 100%; font-family: inherit;
  box-shadow: var(--shadow-sm);
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-2);
  transform: translateX(2px);
  box-shadow: var(--shadow-md);
}
.choice-btn .letter {
  font-family: var(--mono); font-weight: 700; font-size: 13px;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--accent);
  flex-shrink: 0;
}
.choice-btn:hover:not(:disabled) .letter {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

/* Hero number */
.hero-num {
  font-family: var(--display);
  font-weight: 800;
  font-size: 88px;
  line-height: .9;
  letter-spacing: -.04em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* Pills */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  border: 1px solid;
}
.pill-mono { font-family: var(--mono); letter-spacing: .5px; }

/* Tab pill */
.tab-pill {
  padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--text-3);
  font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s ease;
}
.tab-pill:hover { color: var(--text-2); }
.tab-pill.active { background: var(--surface-2); color: var(--accent); border-color: var(--border); }


/* Acceptance form mobile optimisation */
.acc-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.acc-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) {
  .acc-grid3 { grid-template-columns: 1fr 1fr; }
  .acc-grid2 { grid-template-columns: 1fr; }
  .acc-form-input { font-size: 16px !important; padding: 13px 14px !important; min-height: 48px; }
  .acc-verdict-grid { grid-template-columns: 1fr !important; }
  .checklist-row { padding: 10px 6px !important; }
  .check-btn-group button { width: 40px !important; height: 40px !important; font-size: 14px !important; }
}

@media (max-width: 600px) {
  body { font-size: 15px; }
  .hero-num { font-size: 64px; }
  .card { padding: 16px !important; border-radius: 12px; }
  /* Larger tap targets on mobile */
  .btn-primary, .btn-secondary { padding: 13px 18px !important; font-size: 14px !important; min-height: 44px; }
  .btn-ghost { padding: 10px 14px !important; min-height: 36px; }
  .tab-pill { padding: 10px 14px; font-size: 13px; min-height: 40px; }
  /* Nav scroll horizontally on small screens */
  .nav-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tabs .tab-pill { flex-shrink: 0; white-space: nowrap; }
  /* Compact user info in nav */
  .nav-user { font-size: 10px !important; }
  .nav-brand-title { font-size: 13px !important; }
  /* Inputs: prevent iOS zoom on focus by ensuring 16px min */
  input, textarea, select { font-size: 16px !important; padding: 13px 14px !important; }
  /* FAQ answer text - more readable */
  .faq-answer { font-size: 14.5px !important; line-height: 2 !important; }
  /* Tables in scores - smaller padding */
  table { font-size: 12px !important; }
  table th, table td { padding: 8px 6px !important; }
  /* SectionMarker more compact */
  .section-marker { font-size: 11px; }
  /* Remove grid background on mobile - less busy */
  .bg-grid { background-image: none; }
}
